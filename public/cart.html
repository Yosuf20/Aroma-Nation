<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Aroma Nation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold:#ffffff; --gold-dim:aaaaaa; --black:#080808; --dark:#0e0e0e; --card:#111111; --border:#2a2218; --text:#e8e0d0; --muted:#7a7060; }
  body { background: var(--black); color: var(--text); font-family: 'Montserrat', sans-serif; font-weight: 300; min-height: 100vh; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 60px; border-bottom: 1px solid var(--border); background: var(--dark); }
  .nav-logo { font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: 0.3em; color: var(--gold); text-decoration: none; }
  .nav-back { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.3s; }
  .nav-back:hover { color: var(--gold); }

  .page { max-width: 1100px; margin: 0 auto; padding: 60px 40px; }
  .page-title { font-family: 'Cinzel', serif; font-size: 36px; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 60px; }

  .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 40px; }

  .cart-items { display: flex; flex-direction: column; gap: 2px; }
  .cart-item { background: var(--card); border: 1px solid var(--border); padding: 24px; display: flex; gap: 24px; align-items: center; }
  .cart-item-img { width: 80px; height: 80px; object-fit: contain; background: #0f0d08; flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-family: 'Cinzel', serif; font-size: 16px; color: var(--text); margin-bottom: 4px; }
  .cart-item-size { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .cart-item-price { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold); }
  .qty-controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .qty-btn { width: 28px; height: 28px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .qty-btn:hover { border-color: var(--gold); color: var(--gold); }
  .qty-num { font-size: 14px; min-width: 24px; text-align: center; }
  .remove-btn { margin-left: auto; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; transition: color 0.3s; }
  .remove-btn:hover { color: #c0392b; }

  .cart-summary { background: var(--card); border: 1px solid var(--border); padding: 32px; height: fit-content; position: sticky; top: 30px; }
  .summary-title { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.1em; color: var(--text); margin-bottom: 32px; }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .summary-row.total { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 8px; font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--gold); }

  .coupon-section { margin: 20px 0; }
  .coupon-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 10px; }
  .coupon-row { display: flex; gap: 8px; }
  .coupon-input { flex: 1; background: var(--black); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 0.1em; outline: none; transition: border-color 0.3s; text-transform: uppercase; }
  .coupon-input:focus { border-color: var(--gold-dim); }
  .coupon-btn { padding: 10px 16px; background: transparent; border: 1px solid var(--gold-dim); color: var(--gold); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
  .coupon-btn:hover { background: var(--gold); color: var(--black); }
  .coupon-msg { font-size: 11px; margin-top: 8px; }
  .coupon-msg.success { color: #4caf50; }
  .coupon-msg.error { color: #e74c3c; }

  .checkout-btn { width: 100%; padding: 16px; background: var(--gold); color: var(--black); border: none; font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; cursor: pointer; margin-top: 24px; transition: opacity 0.3s; font-weight: 500; }
  .checkout-btn:hover { opacity: 0.9; }
  .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-cart { text-align: center; padding: 80px 0; grid-column: 1/-1; }
  .empty-cart h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-style: italic; color: var(--muted); margin-bottom: 20px; }
  .empty-cart a { display: inline-block; margin-top: 20px; padding: 14px 40px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; transition: all 0.3s; }
  .empty-cart a:hover { background: var(--gold); color: var(--black); }

  @media (max-width: 768px) { .cart-layout { grid-template-columns: 1fr; } nav, .page { padding: 20px 24px; } }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">AROMA NATION</a>
  <a href="/" class="nav-back">← Continue Shopping</a>
</nav>

<div class="page">
  <h1 class="page-title">Your Cart</h1>
  <div class="cart-layout" id="cartLayout"></div>
</div>

<script>
  function getCart() { return JSON.parse(localStorage.getItem('an_cart') || '[]'); }
  function saveCart(c) { localStorage.setItem('an_cart', JSON.stringify(c)); renderCart(); }

  let appliedCoupon = null;

  function renderCart() {
    const cart = getCart();
    const layout = document.getElementById('cartLayout');
    if (cart.length === 0) {
      layout.innerHTML = `<div class="empty-cart"><h2>Your cart is empty</h2><p style="color:var(--muted);font-size:13px">Add some fragrances to get started.</p><a href="/">Browse Collection</a></div>`;
      return;
    }
    const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
    const discount = appliedCoupon ? appliedCoupon.discount : 0;
    const total = Math.max(0, subtotal - discount);

    layout.innerHTML = `
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-summary">
        <h2 class="summary-title">Order Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span>₹${subtotal.toLocaleString('en-IN')}</span></div>
        ${appliedCoupon ? `<div class="summary-row" style="color:#4caf50"><span>Discount (${appliedCoupon.code})</span><span>−₹${discount.toLocaleString('en-IN')}</span></div>` : ''}
        <div class="summary-row"><span>Shipping</span><span style="color:var(--gold)">Free</span></div>
        <div class="summary-row total"><span>Total</span><span>₹${total.toLocaleString('en-IN')}</span></div>

        <div class="coupon-section">
          <span class="coupon-label">Have a coupon?</span>
          <div class="coupon-row">
            <input class="coupon-input" id="couponInput" type="text" placeholder="Enter code" value="${appliedCoupon ? appliedCoupon.code : ''}">
            <button class="coupon-btn" onclick="applyCoupon(${subtotal})">${appliedCoupon ? 'Remove' : 'Apply'}</button>
          </div>
          <div class="coupon-msg" id="couponMsg"></div>
        </div>

        <button class="checkout-btn" onclick="goCheckout(${total})">Proceed to Checkout</button>
      </div>
    `;

    const itemsEl = document.getElementById('cartItems');
    cart.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <img class="cart-item-img" src="https://via.placeholder.com/80x80/111/c9a84c?text=AN" alt="${item.product_name}">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.product_name}</div>
          <div class="cart-item-size">${item.size_ml}ml</div>
          <div class="cart-item-price">₹${Number(item.price).toLocaleString('en-IN')}</div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
            <span class="qty-num">${item.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeItem(${idx})">Remove</button>
      `;
      itemsEl.appendChild(div);
    });
  }

  function changeQty(idx, delta) {
    const cart = getCart();
    cart[idx].quantity += delta;
    if (cart[idx].quantity <= 0) cart.splice(idx, 1);
    saveCart(cart);
  }

  function removeItem(idx) {
    const cart = getCart();
    cart.splice(idx, 1);
    saveCart(cart);
  }

  async function applyCoupon(subtotal) {
    if (appliedCoupon) { appliedCoupon = null; renderCart(); return; }
    const code = document.getElementById('couponInput').value.trim();
    if (!code) return;
    const msg = document.getElementById('couponMsg');
    try {
      const res = await fetch('/api/coupons/validate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ code, order_amount: subtotal }) });
      const data = await res.json();
      if (data.valid) {
        appliedCoupon = { code: data.coupon.code, discount: data.discount };
        renderCart();
      } else {
        msg.className = 'coupon-msg error';
        msg.textContent = data.error;
      }
    } catch { msg.className = 'coupon-msg error'; msg.textContent = 'Error validating coupon.'; }
  }

  function goCheckout(total) {
    const data = { cart: getCart(), coupon: appliedCoupon, total };
    sessionStorage.setItem('an_checkout', JSON.stringify(data));
    window.location.href = '/checkout';
  }

  renderCart();
</script>
</body>
</html>
